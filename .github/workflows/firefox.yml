name: firefox-developer-edition

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  pinned-firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Two P030 PR runs hung here (apt mirror) until cancelled: skip apt when the runner
      # image already has the libraries, bound every apt call, retry, and fail fast.
      - name: Install Firefox runtime libraries
        timeout-minutes: 6
        run: |
          packages="libgtk-3-0 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6"
          if dpkg -s $packages >/dev/null 2>&1; then echo "Firefox runtime libraries already installed"; exit 0; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 150 apt-get $apt_opts update && sudo timeout 150 apt-get $apt_opts install -y $packages; then exit 0; fi
            echo "apt attempt $attempt failed; retrying"; sleep 5
          done
          exit 1

      - name: Verify Firefox harness contracts
        run: npm run test:firefox

      - name: Install exact pinned Firefox Developer Edition
        id: install
        env:
          FIREFOX_INSTALL_ROOT: ${{ runner.temp }}/pcms-firefox
        run: npm run firefox:install

      - name: Smoke pinned Firefox with disposable profile
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_SMOKE_REPORT: ${{ runner.temp }}/firefox-smoke-report.json
        run: npm run firefox:smoke

      - name: Verify P027 harness and inherited P026 regressions
        run: npm run test:p027 && node --test tests/pcms/p026/*.test.mjs

      - name: Verify P028 background Core, wake recovery and UI client protocol
        run: npm run test:p028 && node extension/tests/background-routing-init.test.mjs

      - name: Verify P029 durable timers and inherited P012 timer contracts
        run: npm run test:p029 && node --test tests/pcms/p012-services.test.mjs tests/pcms/p012-boundary.test.mjs

      - name: Verify P030 sandbox pages, browser floor and controller frame lifecycle
        run: npm run test:p030

      - name: Verify P032 dashboard routes, receipt read API and multi-tab durability
        run: npm run test:p032

      - name: Verify P034 Accounts models and durable rebind fencing
        run: npm run test:p034

      - name: Install and drive packaged XPI, lifecycle and platform probes
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_PACKAGED_DIR: ${{ runner.temp }}/pcms-packaged
          FIREFOX_PACKAGED_REPORT: ${{ runner.temp }}/firefox-packaged-report.json
        run: npm run firefox:packaged

      - name: Prove P029 timers with zero PCMS tabs across unload and restart
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_PACKAGED_DIR: ${{ runner.temp }}/pcms-packaged
          FIREFOX_P029_REPORT: ${{ runner.temp }}/firefox-p029-report.json
        run: npm run firefox:packaged:p029

      - name: Upload P029 packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-packaged-p029
          path: ${{ runner.temp }}/firefox-p029-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Execute runtime-supplied controller in a background sandbox frame of the packaged XPI
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_PACKAGED_DIR: ${{ runner.temp }}/pcms-packaged
          FIREFOX_P030_REPORT: ${{ runner.temp }}/firefox-p030-report.json
        run: npm run firefox:packaged:p030

      - name: Upload P030 packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-packaged-p030
          path: ${{ runner.temp }}/firefox-p030-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-packaged-p027
          path: ${{ runner.temp }}/firefox-packaged-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload deterministic smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-developer-edition-smoke
          path: ${{ runner.temp }}/firefox-smoke-report.json
          if-no-files-found: warn
          retention-days: 7

  # Real-browser A032-02 runs on its own disposable runner. Three consecutive
  # Marionette packaged probes on one runner intermittently time out on navigation;
  # this keeps the inherited P027/P029/P030 acceptance sequence unchanged.
  p032-packaged:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Firefox runtime libraries
        timeout-minutes: 6
        run: |
          packages="libgtk-3-0 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6"
          if dpkg -s $packages >/dev/null 2>&1; then echo "Firefox runtime libraries already installed"; exit 0; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 150 apt-get $apt_opts update && sudo timeout 150 apt-get $apt_opts install -y $packages; then exit 0; fi
            echo "apt attempt $attempt failed; retrying"; sleep 5
          done
          exit 1

      - name: Install exact pinned Firefox Developer Edition
        id: install
        env:
          FIREFOX_INSTALL_ROOT: ${{ runner.temp }}/pcms-firefox
        run: npm run firefox:install

      - name: Verify P032 receipts across two packaged Firefox dashboards and after forced unload
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_PACKAGED_DIR: ${{ runner.temp }}/pcms-packaged-p032
          FIREFOX_P032_REPORT: ${{ runner.temp }}/firefox-p032-report.json
        run: npm run firefox:packaged:p032

      - name: Upload P032 packaged receipt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-packaged-p032
          path: ${{ runner.temp }}/firefox-p032-report.json
          if-no-files-found: warn
          retention-days: 7


  # P034 Accounts fixture runs in a separate disposable packaged Firefox,
  # avoiding shared-profile navigation races with inherited packaged checks.
  p034-packaged:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Firefox runtime libraries
        timeout-minutes: 6
        run: |
          packages="libgtk-3-0 libdbus-glib-1-2 libasound2t64 libx11-xcb1 libxt6"
          if dpkg -s $packages >/dev/null 2>&1; then exit 0; fi
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if sudo timeout 150 apt-get $apt_opts update && sudo timeout 150 apt-get $apt_opts install -y $packages; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install exact pinned Firefox Developer Edition
        id: install
        env:
          FIREFOX_INSTALL_ROOT: ${{ runner.temp }}/pcms-firefox
        run: npm run firefox:install
      - name: Exercise P034 Accounts table, detail and guarded rebind in packaged Firefox
        env:
          FIREFOX_BIN: ${{ steps.install.outputs.firefox_bin }}
          FIREFOX_PACKAGED_DIR: ${{ runner.temp }}/pcms-packaged-p034
          FIREFOX_P034_REPORT: ${{ runner.temp }}/firefox-p034-report.json
        run: npm run firefox:packaged:p034
      - name: Upload P034 packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-packaged-p034
          path: ${{ runner.temp }}/firefox-p034-report.json
          if-no-files-found: warn
          retention-days: 7
