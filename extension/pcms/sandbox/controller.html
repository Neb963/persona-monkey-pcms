<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- ADR-003 §1: MV3 has one content_security_policy.sandbox string shared with module-ui.html.
       This meta policy tightens the controller page back to the P004 controller CSP (no styles, images or fonts). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PCMS Controller Sandbox</title>
</head>
<body>
  <script type="module" src="controller.js"></script>
</body>
</html>
